<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trekking Management Application{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    // Small shared helper: every page's Vue app can call apiFetch(path, opts)
    // to hit the Flask API with the JWT attached once app/auth.py issues one.
    async function apiFetch(path, options = {}) {
      const token = localStorage.getItem('tma_token');
      const headers = Object.assign(
        { 'Content-Type': 'application/json' },
        token ? { 'Authorization': 'Bearer ' + token } : {},
        options.headers || {}
      );
      const res = await fetch(path, Object.assign({}, options, { headers }));
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.error || err.message || ('Request failed: ' + res.status));
      }
      return res.status === 204 ? null : res.json();
    }
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
